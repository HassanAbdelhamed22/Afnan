name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CI: "true"
  MONGODB_URI: mongodb://127.0.0.1:27017/afnan-ci
  MONGODB_DB_NAME: afnan-ci
  BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
  BETTER_AUTH_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  RESEND_API_KEY: re_ci_placeholder
  AUTH_EMAIL_FROM: Afnan CI <ci@afnan.invalid>
  ADMIN_EMAIL: admin@afnan.invalid

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:ci
      - run: pnpm build

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
